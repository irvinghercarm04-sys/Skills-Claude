  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // 0.0 s — la caja cae sobre la mesa
      tl.fromTo("#pz-drop", { z: 900, scale: 0.85 }, { z: 0, duration: 0.9, ease: "bounce.out" }, 0);
      tl.fromTo("#pz-drop", { scale: 0.85 }, { scale: 1, duration: 0.9, ease: "power2.out", immediateRender: false }, 0);

      // 1.25 s — anticipación: la tapa se levanta un poco dos veces
      tl.fromTo("#pz-lid", { rotationX: 0, transformOrigin: "0px 0px" }, { rotationX: 9, duration: 0.14, ease: "power2.out" }, 1.25);
      tl.fromTo("#pz-lid", { rotationX: 9 }, { rotationX: 0, duration: 0.18, ease: "bounce.out", immediateRender: false }, 1.39);
      tl.fromTo("#pz-lid", { rotationX: 0 }, { rotationX: 14, duration: 0.16, ease: "power2.out", immediateRender: false }, 1.7);
      tl.fromTo("#pz-lid", { rotationX: 14 }, { rotationX: 0, duration: 0.2, ease: "bounce.out", immediateRender: false }, 1.86);

      // 2.25 s — se abre
      tl.fromTo("#pz-lid", { rotationX: 0 }, { rotationX: 112, duration: 1.0, ease: "back.out(1.6)", immediateRender: false }, 2.25);
      tl.fromTo("#pz-glow", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 2.4);

      // Cámara: se acerca hasta que la caja está abierta y luego se queda quieta
      tl.fromTo("#pz-camera", { scale: 0.92 }, { scale: 1, duration: 3.4, ease: "power2.inOut" }, 0);

      // 3.4 s — título: la línea entera entra desenfocada y aterriza quieta
      tl.fromTo(
        "#pz-title",
        { opacity: 0, y: 24, filter: "blur(10px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out" },
        3.4,
      );

      // Humo y burbujas: función pura del tiempo, dibujada en cada seek
      const wisps = Array.from({ length: 7 }, (_, i) => document.getElementById("pz-wisp-" + i));
      const bubbles = Array.from({ length: 5 }, (_, i) => document.getElementById("pz-bubble-" + i));
      const clamp = (v) => Math.max(0, Math.min(1, v));
      const ease = (v) => v * v * (3 - 2 * v);

      function renderAt(t) {
        const frame = t * 30;
        const amount = ease(clamp((t - 2.45) / 1.2));
        const heat = ease(clamp((t - 2.4) / 0.8));
        wisps.forEach((el, i) => {
          const period = 75 + (i % 3) * 12;
          const p = ((frame + ((i * 37) % period)) % period) / period;
          const xBase = ((i * 71) % 280) - 140;
          const pts = [];
          for (let k = 0; k <= 24; k++) {
            const s = k / 24;
            const x = Math.sin(s * 5.5 + frame / 11 + i * 1.3) * (10 + s * 38);
            pts.push(x.toFixed(1) + "," + (-s * 380).toFixed(1));
          }
          el.setAttribute("d", "M" + pts.join("L"));
          el.setAttribute("transform", "translate(" + xBase + " " + (-p * 260).toFixed(1) + ") scale(" + (0.8 + p * 0.5).toFixed(3) + ")");
          el.setAttribute("opacity", (Math.sin(Math.PI * p) * 0.85 * amount).toFixed(3));
        });
        bubbles.forEach((el, i) => {
          const b = (Math.sin(frame / 7 + i * 1.7) + 1) / 2;
          el.setAttribute("r", (4 + b * 5).toFixed(2));
          el.setAttribute("opacity", (heat * (0.3 + b * 0.5)).toFixed(3));
        });
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);

      window.__timelines["pizza"] = tl;
    })();
  </script>
